<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Campus Pulse - live safety board</title><link rel="stylesheet" href="style.css">
<style>main{max-width:1100px}.two{display:grid;grid-template-columns:3fr 2fr;gap:18px}@media(max-width:800px){.two{grid-template-columns:1fr}}</style></head><body>
<header><h1>📡 Campus Pulse</h1><span class="muted" style="color:#fff9" id="upd"></span><a href="/">Report</a><a href="/admin.html">Authority</a></header>
<main>
<div class="kpis">
  <div class="kpi"><span class="gauge" id="score">-</span><br><span class="muted">Campus safety pulse</span></div>
  <div class="kpi"><b id="open">-</b><span class="muted">Open issues</span></div>
  <div class="kpi"><b id="resolved">-</b><span class="muted">Resolved (24h)</span></div>
  <div class="kpi"><b id="resp">-</b><span class="muted">Avg first response</span></div>
</div>
<div class="two">
  <div class="card"><h2>Live map <label style="display:inline;font-weight:400"><input type="checkbox" id="heat" style="width:auto" checked> heatmap</label></h2>
    <svg id="map" class="map" style="cursor:default" viewBox="0 0 100 70"></svg></div>
  <div class="card"><h2>Hotspots</h2><div id="hot"></div><h2 style="margin-top:18px">Live activity</h2><div class="ticker" id="tick"></div></div>
</div>
<p class="muted">Anonymous, public view: no descriptions, names or exact locations are shown. Use the <a href="/">Report page</a> to get help.</p>
</main>
<script src="common.js"></script>
<script>
let data = null;
const W = {Low:1, Medium:3, High:6, Critical:12};
function draw() {
  if (!data) return;
  $("#map").innerHTML = mapSVG(data.open, {heat:$("#heat").checked});
  const score = Math.max(0, Math.round(100 - data.open.reduce((a, i) => a + W[i.priority], 0) * 2));
  $("#score").textContent = score; $("#score").style.color = score > 75 ? "var(--low)" : score > 45 ? "var(--medium)" : "var(--critical)";
  $("#open").textContent = data.open.length; $("#resolved").textContent = data.resolvedToday;
  $("#resp").textContent = data.avgResponseMinutes == null ? "-" : data.avgResponseMinutes + " min";
  const z = {}; data.open.forEach(i => { if (i.x != null) { const n = nearestZone(i.x, i.y); z[n] = (z[n] || 0) + W[i.priority]; } });
  const rows = Object.entries(z).sort((a, b) => b[1] - a[1]).slice(0, 5), m = Math.max(1, ...rows.map(r => r[1]));
  $("#hot").innerHTML = rows.map(([n, v]) => `<div class="bar"><span class="l">${esc(n)}</span><i style="width:${v/m*60}%;background:var(--high)"></i></div>`).join("") || '<span class="muted">All quiet 🎉</span>';
  const verb = {Reported:"reported", Assigned:"assigned to a team", "In Progress":"being handled", Resolved:"resolved ✅"};
  $("#tick").innerHTML = data.ticker.map(e => `<div>${EMOJI[e.category]} ${esc(e.category)} issue ${verb[e.status]} <span class="muted">· ${new Date(e.t*1000).toLocaleTimeString()}</span></div>`).join("");
  $("#upd").textContent = "Updated " + new Date().toLocaleTimeString();
}
async function poll() { try { data = await api("/api/board"); draw(); } catch {} }
$("#heat").onchange = draw; poll(); setInterval(poll, 4000);
</script></body></html>
