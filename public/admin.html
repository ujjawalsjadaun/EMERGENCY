<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Campus Assist - Command center</title><link rel="stylesheet" href="style.css">
<style>main{max-width:1200px}.two{display:grid;grid-template-columns:1fr 1fr;gap:18px}@media(max-width:800px){.two{grid-template-columns:1fr}}</style></head><body class="cmd">
<header><h1>🛡️ Command Center</h1><a href="#" id="mute">🔔 Siren on</a><a href="/board.html">Public board</a><a href="/">Student view</a><a href="#" id="out" class="hidden">Log out</a></header>
<main>
<form class="card" id="login" style="max-width:340px;margin:60px auto">
  <h2>Authority login</h2><input type="password" id="pw" placeholder="Password" autofocus>
  <p class="err" id="lerr"></p><button>Log in</button><p class="muted">Password is printed in the server console at startup.</p>
</form>

<div id="app" class="hidden" style="display:none;gap:18px">
  <div class="kpis" id="kpis"></div>
  <div class="two">
    <div class="card"><h2>Campus map <label style="display:inline;font-weight:400"><input type="checkbox" id="heat" style="width:auto"> heatmap</label></h2>
      <svg id="map" class="map" style="cursor:default" viewBox="0 0 100 70"></svg>
      <div class="row" style="margin-top:8px"><button class="sec" id="play" style="flex:0">▶ Replay</button><input type="range" id="tl" min="0" max="1000" value="1000"><span id="tlt" class="muted" style="flex:0;white-space:nowrap">Live</span></div></div>
    <div class="card"><h2>Live analytics</h2>
      <div style="height:170px"><canvas id="chCat"></canvas></div>
      <div style="height:150px;margin-top:10px"><canvas id="chDay"></canvas></div>
      <div style="height:150px;margin-top:10px"><canvas id="chRes"></canvas></div></div>
  </div>
  <div class="card">
    <h2>Reported issues</h2>
    <div class="row"><select id="fc"><option value="">All categories</option></select><select id="fp"><option value="">All priorities</option></select>
    <select id="fs"><option value="">All statuses</option></select></div>
    <div style="overflow-x:auto"><table><thead><tr><th>ID</th><th>Category</th><th>Priority</th><th>Status</th><th>Response SLA</th><th>Location</th><th>👥</th><th>Reported</th></tr></thead><tbody id="rows"></tbody></table></div>
  </div>
  <div class="card hidden" id="detail"></div>
</div>
</main>
<script src="vendor/chart.umd.min.js"></script>
<script src="common.js"></script>
<script>
let meta, all = [], sel = null, es, sirenOn = true, replayT = null;
const app = $("#app");
const show = on => { $("#login").style.display = on ? "none" : ""; app.style.display = on ? "grid" : "none"; $("#out").classList.toggle("hidden", !on); };
const ring = () => sirenOn && siren();

$("#mute").onclick = e => { e.preventDefault(); sirenOn = !sirenOn; e.target.textContent = sirenOn ? "🔔 Siren on" : "🔕 Siren muted"; if (sirenOn) siren(); };
$("#login").onsubmit = async e => {
  e.preventDefault();
  try { const r = await api("/api/login", {method:"POST", body:{password:$("#pw").value}}); sessionStorage.setItem("token", r.token); start(); }
  catch (x) { $("#lerr").textContent = x.message; }
};
$("#out").onclick = e => { e.preventDefault(); sessionStorage.removeItem("token"); if (es) es.close(); show(false); };

async function start() {
  try {
    meta = await api("/api/meta");
    for (const [id, arr] of [["fc", meta.categories], ["fp", meta.priorities], ["fs", meta.statuses]])
      $("#" + id).innerHTML = $("#" + id).options[0].outerHTML + arr.map(v => `<option>${esc(v)}</option>`).join("");
    show(true); await load();
    if (es) es.close();
    es = new EventSource("/api/events?token=" + sessionStorage.getItem("token"));
    es.addEventListener("created", ev => {
      const i = JSON.parse(ev.data); toast(`${i.sos ? "🆘 SOS" : "🚨 New " + i.priority} ${i.category} - ${i.location}`);
      if (i.sos || i.priority === "Critical") ring(); load();
    });
    es.addEventListener("updated", () => load());
    es.addEventListener("alert", ev => { const a = JSON.parse(ev.data); toast(`⏰ ${a.id}: ${a.text}`); if (a.priority === "Critical") ring(); });
    if (window.Notification && Notification.permission === "default") Notification.requestPermission();
  } catch (x) { if (x.status === 401) show(false); }
}
["fc","fp","fs"].forEach(id => $("#" + id).onchange = render);
$("#heat").onchange = drawMap;

async function load() {
  const [list, st] = await Promise.all([api("/api/issues"), api("/api/stats")]);
  all = list; renderStats(st); render();
}
const filtered = () => all.filter(i => (!$("#fc").value || i.category === $("#fc").value) && (!$("#fp").value || i.priority === $("#fp").value) && (!$("#fs").value || i.status === $("#fs").value));
const seen = {};
function render() {
  $("#rows").innerHTML = filtered().map(i => `<tr class="click ${i.sos && i.status !== "Resolved" ? "sos" : ""} ${seen[i.id] !== undefined && seen[i.id] !== i.updated ? "flash" : seen[i.id] === undefined && Object.keys(seen).length ? "flash" : ""}" data-id="${i.id}"><td>${i.sos ? "🆘 " : ""}${i.id}</td><td>${EMOJI[i.category]} ${esc(i.category)}</td>
    <td><span class="badge b-${i.priority}">${i.priority}</span></td><td><span class="badge st st-${i.status}">${i.status}</span></td>
    <td>${i.slaDue ? `<span class="sla" data-due="${i.slaDue}"></span>` : "-"}</td>
    <td>${esc(i.location)}</td><td>${i.votes}</td><td class="muted">${fmt(i.created)}</td></tr>`).join("") || `<tr><td colspan="8" class="muted">No issues match.</td></tr>`;
  all.forEach(i => seen[i.id] = i.updated);
  drawMap(); tickSla(); if (sel) renderDetail();
}
function tickSla() {
  document.querySelectorAll(".sla[data-due]").forEach(el => { const left = el.dataset.due - Date.now() / 1000;
    el.textContent = left > 0 ? mmss(left) : "OVERDUE"; el.classList.toggle("late", left <= 0); });
}
setInterval(tickSla, 1000);
$("#rows").onclick = e => { const r = e.target.closest("tr[data-id]"); if (r) { sel = r.dataset.id; $("#detail").dataset.id = ""; renderDetail(); $("#detail").scrollIntoView({behavior:"smooth"}); } };

// --- map + time-lapse replay ---
function drawMap() {
  const t = replayT, pins = t ? all.filter(i => i.created <= t && (!i.resolved || i.resolved > t)) : all.filter(i => i.status !== "Resolved");
  $("#map").innerHTML = mapSVG(pins, {heat:$("#heat").checked});
}
const span = () => { const lo = Math.min(...all.map(i => i.created), Date.now() / 1000 - 3600); return [lo, Date.now() / 1000]; };
$("#tl").oninput = () => { const [lo, hi] = span(), v = +$("#tl").value; replayT = v >= 1000 ? null : lo + (hi - lo) * v / 1000;
  $("#tlt").textContent = replayT ? new Date(replayT * 1000).toLocaleString() : "Live"; drawMap(); };
let playing = null;
$("#play").onclick = () => {
  if (playing) { clearInterval(playing); playing = null; $("#play").textContent = "▶ Replay"; return; }
  $("#tl").value = 0; $("#play").textContent = "⏸ Pause";
  playing = setInterval(() => { $("#tl").value = +$("#tl").value + 8; $("#tl").oninput(); if (+$("#tl").value >= 1000) { clearInterval(playing); playing = null; $("#play").textContent = "▶ Replay"; } }, 100);
};

const kpiPrev = {};
function countUp(el, to, suffix) {   // animate a KPI from its previous value to the new one
  const from = kpiPrev[el.dataset.k] || 0; kpiPrev[el.dataset.k] = to; const t0 = performance.now();
  const step = t => { const p = Math.min(1, (t - t0) / 600); el.textContent = Math.round(from + (to - from) * p) + suffix; if (p < 1) requestAnimationFrame(step); };
  requestAnimationFrame(step);
}
const charts = {};
function chart(id, type, labels, data, colors, opts = {}) {   // create once, then update in place so changes animate
  if (charts[id]) { charts[id].data.labels = labels; charts[id].data.datasets[0].data = data; charts[id].update(); return; }
  charts[id] = new Chart($("#" + id), {type, data:{labels, datasets:[{data, backgroundColor:colors, borderColor:colors, borderWidth: type === "line" ? 2 : 0, tension:.35, fill: type === "line"}]},
    options:{responsive:true, maintainAspectRatio:false, plugins:{legend:{display:type === "doughnut", position:"right", labels:{color:"#9aa4b8", boxWidth:10}}, title:{display:true, text:opts.title, color:"#9aa4b8"}},
      scales: type === "doughnut" ? {} : {x:{ticks:{color:"#9aa4b8"},grid:{display:false}}, y:{beginAtZero:true, ticks:{color:"#9aa4b8", precision:0}, grid:{color:"#2a3142"}}}}});
}
function renderStats(s) {
  const crit = all.filter(i => i.priority === "Critical" && i.status !== "Resolved").length;
  const kpis = [["Total", s.total, ""], ["Open", s.open, ""], ["Critical open", crit, ""], ["SOS alerts", s.sos, ""], ["Resolved", s.byStatus.Resolved, ""],
    ["Avg response", s.avgResponseMinutes, " min"], ["Avg resolution", s.avgResolutionHours, " h"]];
  if (!$("#kpis").children.length) $("#kpis").innerHTML = kpis.map(([k]) => `<div class="kpi"><b data-k="${k}">0</b><span class="muted">${k}</span></div>`).join("");
  kpis.forEach(([k, v, suf]) => { const el = $(`#kpis b[data-k="${k}"]`); if (v == null) el.textContent = "-"; else countUp(el, v, suf); });
  const cats = Object.keys(s.byCategory);
  chart("chCat", "doughnut", cats.map(c => EMOJI[c] + " " + c), Object.values(s.byCategory), ["#e5484d", "#f5a524", "#3e63dd", "#7a5af8", "#2e9e6b", "#8b8d98"], {title:"Reports by category"});
  chart("chDay", "line", Object.keys(s.perDay).map(d => d.slice(5)), Object.values(s.perDay), "#6c8cff", {title:"Reports per day"});
  const rc = cats.filter(c => s.avgResolutionByCategory[c] != null);
  chart("chRes", "bar", rc, rc.map(c => s.avgResolutionByCategory[c]), "#2e9e6b", {title:"Avg hours to resolve"});
}

function renderDetail() {
  const i = all.find(x => x.id === sel), d = $("#detail");
  if (!i) { d.classList.add("hidden"); return; }
  if (d.dataset.id === i.id) {   // same issue: only refresh chat + timeline so typing isn't lost
    $("#d-chat").innerHTML = chatHTML(i.messages, "authority"); $("#d-tl").innerHTML = timeline(i.history); return; }
  d.dataset.id = i.id; d.classList.remove("hidden");
  const opts = (arr, cur) => arr.map(v => `<option ${v === cur ? "selected" : ""}>${esc(v)}</option>`).join("");
  d.innerHTML = `<h2>${i.sos ? "🆘 " : ""}${i.id} · ${EMOJI[i.category]} ${esc(i.category)} <span class="badge b-${i.priority}">${i.priority}</span></h2>
    <p>${esc(i.description)}</p><p class="muted">📍 ${esc(i.location)} · Reporter: ${esc(i.reporter || "anonymous")} ${esc(i.contact || "")} · 👥 ${i.votes} report(s)</p>
    ${i.image ? `<img class="thumb" src="${esc(i.image)}">` : ""}
    <div class="row"><div><label>Status</label><select id="d-status">${opts(meta.statuses, i.status)}</select></div>
    <div><label>Priority</label><select id="d-pri">${opts(meta.priorities, i.priority)}</select></div>
    <div><label>Department</label><select id="d-dept">${opts(meta.departments, i.department)}</select></div>
    <div><label>Assign to person</label><input id="d-who" value="${esc(i.assignee || "")}" placeholder="Name"></div></div>
    <label>Note on timeline (visible to student)</label><input id="d-note" placeholder="e.g. Ambulance dispatched, ETA 5 min">
    <p><button id="d-save">Save update</button> <button class="sec" id="d-close">Close</button></p>
    <h4 style="margin:10px 0 0">💬 Chat with student</h4><div id="d-chat">${chatHTML(i.messages, "authority")}</div>
    <div class="row"><input id="d-msg" placeholder="Message the student…"><button id="d-send" style="flex:0">Send</button></div>
    <h4 style="margin:14px 0 6px">Timeline</h4><div id="d-tl">${timeline(i.history)}</div>`;
  $("#d-close").onclick = () => { sel = null; d.dataset.id = ""; d.classList.add("hidden"); };
  const send = async () => { const t = $("#d-msg").value.trim(); if (t) { $("#d-msg").value = ""; await api(`/api/issues/${i.id}/messages`, {method:"POST", body:{text:t}}); } };
  $("#d-send").onclick = send; $("#d-msg").onkeydown = e => e.key === "Enter" && send();
  $("#d-save").onclick = async () => {
    await api("/api/issues/" + i.id, {method:"PATCH", body:{status:$("#d-status").value, priority:$("#d-pri").value,
      department:$("#d-dept").value, assignee:$("#d-who").value, note:$("#d-note").value}});
    d.dataset.id = ""; toast("Updated " + i.id); load();
  };
}
if (sessionStorage.getItem("token")) start();
</script></body></html>
